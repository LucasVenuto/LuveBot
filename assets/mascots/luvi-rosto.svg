<style>.m-eye,.m-body,.m-sat,.m-ping{transform-box:fill-box}.m-eye{transform-origin:50% 50%}.m-body{transform-origin:50% 100%}.m-sat{transform-origin:50% 50%}.m-orbit,.m-shadow{transform-box:view-box}.m-ping{opacity:0;transform-origin:50% 50%}.needs-you .m-sat-fill,#lb-needs-you:target .m-sat-fill{fill:#fbbf24}.m-alert{opacity:0}.needs-you .m-alert,#lb-needs-you:target .m-alert{opacity:1}.lb-face .m-orbit,.lb-face .m-shadow{display:none}.m-prop,.m-float{transform-box:fill-box;transform-origin:50% 50%}@media (prefers-reduced-motion:no-preference){.m-eye{animation:lb-blink var(--blink,5s) var(--delay,0s) infinite}.m-body{animation:lb-breathe var(--breathe,3.6s) var(--delay,0s) ease-in-out infinite alternate}.m-gaze{animation:lb-look var(--look,11s) var(--delay,0s) ease-in-out infinite}.m-face{animation:lb-look-soft var(--look,11s) var(--delay,0s) ease-in-out infinite}.m-orbit{animation:lb-orbit var(--orbit,7s) linear infinite}.m-sat{animation:lb-depth var(--orbit,7s) ease-in-out infinite}.is-working .m-gaze,#lb-working:target .m-gaze{animation:none}.is-working .m-pair,#lb-working:target .m-pair{animation:lb-scan 1.5s ease-in-out infinite}.is-working .m-orbit,.is-working .m-sat,#lb-working:target .m-orbit,#lb-working:target .m-sat{animation-duration:1.8s}.is-working .m-body,#lb-working:target .m-body{animation-duration:1.1s}.needs-you .m-hop,#lb-needs-you:target .m-hop{animation:lb-hop 1.9s cubic-bezier(.3,.7,.4,1) infinite}.needs-you .m-body,#lb-needs-you:target .m-body{animation:lb-squash 1.9s ease-in-out infinite}.needs-you .m-shadow,#lb-needs-you:target .m-shadow{animation:lb-shadow 1.9s cubic-bezier(.3,.7,.4,1) infinite}.needs-you .m-ping,#lb-needs-you:target .m-ping{animation:lb-ping 1.9s ease-out infinite}.m-prop{animation:lb-prop .9s linear infinite}.is-working .m-prop,#lb-working:target .m-prop{animation-duration:.22s}.m-blinker{animation:lb-blinker 2.2s steps(1) infinite}.is-working .m-blinker,#lb-working:target .m-blinker{animation-duration:.5s}.m-float{animation:lb-float 3s ease-in-out infinite alternate}.m-wobble{transform-box:fill-box;transform-origin:20% 80%;animation:lb-wobble 4s ease-in-out infinite}.is-working .m-wobble,#lb-working:target .m-wobble{animation:lb-sweep 1.5s ease-in-out infinite}}@keyframes lb-blink{0%,16%,20%,59%,63%,64.5%,68.5%,100%{transform:scaleY(1)}18%,61%,66.5%{transform:scaleY(.08)}}@keyframes lb-breathe{from{transform:scale(1,1)}to{transform:scale(1.025,.972)}}@keyframes lb-look{0%,36%{transform:translate(0,0)}41%,54%{transform:translate(-4.5px,0)}59%,63%{transform:translate(0,0)}68%,80%{transform:translate(4px,-1.5px)}86%,100%{transform:translate(0,0)}}@keyframes lb-look-soft{0%,36%{transform:translate(0,0)}41%,54%{transform:translate(-2px,0)}59%,63%{transform:translate(0,0)}68%,80%{transform:translate(2px,-.5px)}86%,100%{transform:translate(0,0)}}@keyframes lb-scan{0%,100%{transform:translate(-5px,0)}50%{transform:translate(5px,0)}}@keyframes lb-orbit{to{transform:rotate(360deg)}}@keyframes lb-depth{0%,100%{transform:scale(1)}25%{transform:scale(1.12)}75%{transform:scale(.86)}}@keyframes lb-hop{0%,46%,100%{transform:translateY(0)}20%{transform:translateY(var(--hop,-18px))}36%{transform:translateY(0)}41%{transform:translateY(calc(var(--hop,-18px)*.28))}}@keyframes lb-squash{0%,46%,100%{transform:scale(1,1)}6%{transform:scale(1.07,.9)}14%{transform:scale(.95,1.06)}34%{transform:scale(1,1)}37%{transform:scale(1.06,.92)}43%{transform:scale(.99,1.01)}}@keyframes lb-shadow{0%,36%,46%,100%{transform:scale(1);opacity:.16}20%{transform:scale(.72);opacity:.08}41%{transform:scale(.92)}}@keyframes lb-ping{0%,30%{transform:scale(1);opacity:0}34%{opacity:.7}70%,100%{transform:scale(1.8);opacity:0}}@keyframes lb-prop{0%,100%{transform:scaleX(1)}50%{transform:scaleX(-1)}}@keyframes lb-float{from{transform:translateY(0)}to{transform:translateY(-4px)}}@keyframes lb-blinker{0%,100%{opacity:1}50%{opacity:.25}}@keyframes lb-wobble{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg)}}@keyframes lb-sweep{0%,100%{transform:translate(-4px,0) rotate(-4deg)}50%{transform:translate(6px,-3px) rotate(6deg)}}</style>
