<style>.m-eye,.m-body,.m-sat,.m-ping{transform-box:fill-box}.m-eye{transform-origin:50% 50%}.m-body{transform-origin:50% 100%}.m-sat{transform-origin:50% 50%}.m-orbit,.m-shadow{transform-box:view-box}.m-ping{opacity:0;transform-origin:50% 50%}.needs-you .m-sat-fill,#lb-needs-you:target .m-sat-fill{fill:#fbbf24}.m-alert{opacity:0}.needs-you .m-alert,#lb-needs-you:target .m-alert{opacity:1}.lb-face .m-orbit,.lb-face .m-shadow{display:none}.m-prop,.m-float{transform-box:fill-box;transform-origin:50% 50%}@media (prefers-reduced-motion:no-preference){.m-eye{animation:lb-blink var(--blink,5s) var(--delay,0s) infinite}.m-body{animation:lb-breathe var(--breathe,3.6s) var(--delay,0s) ease-in-out infinite alternate}.m-gaze{animation:lb-look var(--look,11s) var(--delay,0s) ease-in-out infinite}.m-face{animation:lb-look-soft var(--look,11s) var(--delay,0s) ease-in-out infinite}.m-orbit{animation:lb-orbit var(--orbit,7s) linear infinite}.m-sat{animation:lb-depth var(--orbit,7s) ease-in-out infinite}.is-working .m-gaze,#lb-working:target .m-gaze{animation:none}.is-working .m-pair,#lb-working:target .m-pair{animation:lb-scan 1.5s ease-in-out infinite}.is-working .m-orbit,.is-working .m-sat,#lb-working:target .m-orbit,#lb-working:target .m-sat{animation-duration:1.8s}.is-working .m-body,#lb-working:target .m-body{animation-duration:1.1s}.needs-you .m-hop,#lb-needs-you:target .m-hop{animation:lb-hop 1.9s cubic-bezier(.3,.7,.4,1) infinite}.needs-you .m-body,#lb-needs-you:target .m-body{animation:lb-squash 1.9s ease-in-out infinite}.needs-you .m-shadow,#lb-needs-you:target .m-shadow{animation:lb-shadow 1.9s cubic-bezier(.3,.7,.4,1) infinite}.needs-you .m-ping,#lb-needs-you:target .m-ping{animation:lb-ping 1.9s ease-out infinite}.m-prop{animation:lb-prop .9s linear infinite}.is-working .m-prop,#lb-working:target .m-prop{animation-duration:.22s}.m-blinker{animation:lb-blinker 2.2s steps(1) infinite}.is-working .m-blinker,#lb-working:target .m-blinker{animation-duration:.5s}.m-float{anim