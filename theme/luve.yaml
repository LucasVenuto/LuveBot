name: luve
label: Luve
description: LuveBot mission control theme for Hermes dashboard

palette:
  background:
    hex: "#0b0f19"
    alpha: 1.0
  midground:
    hex: "#f8fafc"
    alpha: 1.0
  foreground:
    hex: "#ffffff"
    alpha: 0
  warmGlow: "rgba(56, 189, 248, 0.15)"
  noiseOpacity: 0.4

typography:
  fontSans: 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
  fontMono: 'ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace'
  fontDisplay: 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif'
  baseSize: "14px"
  lineHeight: "1.45"
  letterSpacing: "-0.011em"

layout:
  radius: "0.375rem"
  density: compact

layoutVariant: tiled

colorOverrides:
  card: "#111827"
  cardForeground: "#f8fafc"
  popover: "#1e293b"
  popoverForeground: "#f8fafc"
  primary: "#38bdf8"
  primaryForeground: "#0b0f19"
  secondary: "#1e293b"
  secondaryForeground: "#e2e8f0"
  muted: "#1e293b"
  mutedForeground: "#94a3b8"
  accent: "#1e293b"
  accentForeground: "#f8fafc"
  destructive: "#f87171"
  destructiveForeground: "#ffffff"
  success: "#4ade80"
  warning: "#fbbf24"
  border: "#334155"
  input: "#1e293b"
  ring: "#38bdf8"

seriesColors:
  inputTokenAccent: "#38bdf8"
  outputTokenAccent: "#4ade80"

swatchColors:
  - "#0b0f19"
  - "#38bdf8"
  - "#f8fafc"

terminalBackground: "#0b0f19"
terminalForeground: "#f8fafc"

componentStyles:
  card:
    boxShadow: "0 1px 2px 0 rgba(0, 0, 0, 0.4), inset 0 0 0 1px rgba(255, 255, 255, 0.05)"
  header:
    borderBottom: "1px solid #334155"
    backgroundColor: "#0b0f19"
  sidebar:
    borderRight: "1px solid #334155"
    backgroundColor: "#080c14"
